<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Preditor de Câncer de Pulmão</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      width: 100%;
      max-width: 720px;
      border: none;
      border-radius: 1rem;
      box-shadow: 0 0.75rem 1.5rem rgba(0,0,0,.06);
    }
    .list-group-item {
      border: none;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>
<body>
  <div class="card p-4">
    <h2 class="mb-4 text-center fw-bold">Preditor de Câncer de Pulmão</h2>

    <!-- Formulário -->
    <form method="post" class="row g-3">
      {% csrf_token %}
      {% for field in form %}
        <div class="col-md-4">
          <label class="form-label fw-semibold">{{ field.label }}</label>
          {{ field }}
        </div>
      {% endfor %}
      <div class="col-12 text-center mt-3">
        <button type="submit" class="btn btn-primary px-5">Calcular</button>
      </div>
    </form>

    <!-- Resultado -->
    {% if probability is not None %}
      <div class="alert alert-info mt-4 text-center">
        <h4 class="alert-heading">Probabilidade</h4>
        <p class="display-6 mb-0">{{ probability }}%</p>
      </div>

      <h5 class="mt-4">Respostas do paciente</h5>
      <ul class="list-group">
        {% for pergunta, resposta in respostas %}
          <li class="list-group-item d-flex justify-content-between">
            <span>{{ pergunta }}</span>
            <span class="fw-bold">{{ resposta }}</span>
          </li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
